services:
  postgres:
    image: postgres:16-alpine
    container_name: ratchet-postgres
    environment:
      POSTGRES_USER: ratchet
      POSTGRES_PASSWORD: ratchet_password
      POSTGRES_DB: ratchet_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ratchet -d ratchet_db"]
      interval: 3s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ratchet-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata: